name: Update Contribution City

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_city.py'
      - '.github/workflows/skyline.yml'

permissions:
  contents: write

concurrency:
  group: contribution-city
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build city from GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_city.py
      - name: Commit updated artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-city.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update contribution city'
          git push
